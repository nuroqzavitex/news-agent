name: news-agent

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://news:news@postgres:5432/news
    REDIS_URL: redis://redis:6379/0
    LOCAL_REGISTRY_FILE: ${LOCAL_REGISTRY_FILE:-local_registry.yaml}
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}

x-mock: &mock
  build: ./backend
  profiles: [mock]
  env_file:
    - path: .env
      required: false
  command: ["uvicorn", "scripts.mock_agent:app", "--host", "0.0.0.0", "--port", "9001"]
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_sources"]
    depends_on:
      postgres: {condition: service_healthy}

  agent-api:
    <<: *backend
    ports: ["8008:8008"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/card')"]
      interval: 10s
      retries: 5

  crawler:
    <<: *backend
    command: ["python", "-m", "app.workers.crawler"]

  processor:
    <<: *backend
    command: ["python", "-m", "app.workers.processor"]

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.workers.scheduler"]

  enricher:
    <<: *backend
    command: ["python", "-m", "app.workers.enricher"]

  # Stand-ins for other teams' agents. Made-up data, marked "mock": true. Ports are for injecting faults by hand.
  mock-finance-a:
    <<: *mock
    environment: {MOCK_AGENT_ID: mock-finance-a, MOCK_CAPABILITIES: stock_price, MOCK_CONFIDENCE: "0.9"}
    ports: ["9001:9001"]

  mock-finance-b:
    <<: *mock
    environment:
      {MOCK_AGENT_ID: mock-finance-b, MOCK_CAPABILITIES: stock_price, MOCK_PRICE_BIAS: "0.02", MOCK_CONFIDENCE: "0.7"}
    ports: ["9002:9001"]

  mock-weather:
    <<: *mock
    environment: {MOCK_AGENT_ID: mock-weather, MOCK_CAPABILITIES: weather}
    ports: ["9003:9001"]

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://agent-api:8008
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on:
      agent-api: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
