name: news-agent

x-backend: &backend
  build: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://news:news@postgres:5432/news
    REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    migrate: {condition: service_completed_successfully}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news
      POSTGRES_DB: news
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    <<: *backend
    restart: "no"
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.seed_sources"]
    depends_on:
      postgres: {condition: service_healthy}

  agent-api:
    <<: *backend
    ports: ["8008:8008"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/card')"]
      interval: 10s
      retries: 5

  crawler:
    <<: *backend
    command: ["python", "-m", "app.workers.crawler"]

  processor:
    <<: *backend
    command: ["python", "-m", "app.workers.processor"]

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.workers.scheduler"]

  enricher:
    <<: *backend
    command: ["python", "-m", "app.workers.enricher"]

  frontend:
    build: ./frontend
    environment:
      API_INTERNAL_URL: http://agent-api:8008
    ports: ["3000:3000"]
    restart: unless-stopped
    depends_on:
      agent-api: {condition: service_healthy}

volumes:
  pgdata:
  redisdata:
